[package]
name = "hayate"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "High-performance completion-based QUIC transfer engine."
documentation = "https://docs.rs/hayate"
readme = "README.md"
keywords = ["quic", "transfer", "compio", "lan", "crypto"]
categories = ["network-programming", "asynchronous"]

[lib]
name = "hayate"
crate-type = ["lib"]

[dependencies]
# Asynchronous Runtime (Proactor-based Thread-Per-Core)
compio = { workspace = true, features = ["time", "fs", "net", "runtime", "macros"] }
compio-runtime = { workspace = true }
compio-quic = { workspace = true }
futures-util = { workspace = true }

# QUIC Protocol State Machine & TLS Core
quinn-proto = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }

# Cryptography, Key Exchange & Hashing
x25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
ring = { workspace = true }

# Directory Packaging & Safe Extraction
tar = "0.4"
walkdir = "2"

# Local Network Utilities & IP Discovery
get_if_addrs = "0.5.3"
local-ip-address = "0.6.13"

# Networking & Byte Buffering
socket2 = { workspace = true }
bytes = { workspace = true }

# Compression
zstd = { workspace = true }

# Asynchronous Synchronization & Messaging
flume = "0.12.0"
rand = { workspace = true }

# Error Handling & Hex Serialization
anyhow = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
compio = { version = "0.19.0", features = [
  "macros",
  "fs",
  "net",
  "runtime",
  "time",
] }
divan = { version = "4.7.0", package = "codspeed-divan-compat" }

[[bench]]
name = "crypto"
harness = false

[[bench]]
name = "protocol"
harness = false
