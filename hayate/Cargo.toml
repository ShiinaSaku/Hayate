[package]
name = "hayate"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "High-performance completion-based QUIC transfer engine."
documentation = "https://docs.rs/hayate"
readme = "README.md"
keywords = ["quic", "transfer", "compio", "lan", "crypto"]
categories = ["network-programming", "asynchronous"]

[lints]
workspace = true

[lib]
name = "hayate"
crate-type = ["lib"]

[features]
benchmarks = []

[dependencies]
# Runtime and QUIC transport.
compio = { workspace = true }
compio-quic = { workspace = true }
futures-util = { workspace = true }

# QUIC protocol and TLS.
quinn-proto = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
# x25519-dalek 3 and rand 0.10 share rand_core 0.10. OsRng moved to
# getrandom::SysRng (wrapped via rand_core::UnwrapErr) in this rand_core line.
rand_core = { version = "0.10" }
getrandom = { version = "0.4", features = ["sys_rng"] }
ring = { workspace = true }
x25519-dalek = { workspace = true }

# Directory packaging and safe extraction.
tar = { workspace = true }
walkdir = { workspace = true }

# Local network utilities.
if-addrs = { workspace = true }
socket2 = { workspace = true }

# Compression, channels, and errors.
flume = { workspace = true }
mdns-sd = { workspace = true }
zstd = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
compio = { workspace = true }
divan = "0.1.21"
blake3 = { workspace = true }
ring = { workspace = true }

[[bench]]
name = "crypto"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "protocol"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "hashing"
harness = false
required-features = ["benchmarks"]
