[package]
name = "hayate-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "High-performance command-line utility for direct LAN file transfer."
documentation = "https://shiinasaku.github.io/Hayate"
readme = "../README.md"
keywords = ["quic", "transfer", "cli", "lan", "utility"]
categories = ["command-line-utilities", "network-programming"]
publish = false

[lints]
workspace = true

[[bin]]
name = "hayate"
path = "src/main.rs"

[dependencies]
hayate = { path = "../hayate", version = "6.0.0" }
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = "4"
compio = { workspace = true }
compio-quic = { workspace = true }
console = { workspace = true }
flume = { workspace = true }
futures-util = { workspace = true }
if-addrs = { workspace = true }
indicatif = { workspace = true }
inquire = { workspace = true }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
dirs = "6"
libc = "0.2"
rand = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

