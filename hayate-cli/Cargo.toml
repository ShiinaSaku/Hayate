[package]

name = 'hayate-cli'
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]

name = 'hayate'
path = 'src/main.rs'

[dependencies]

hayate-engine = { path = '../hayate-engine' }
compio = { version = "0.19.0", features = ['macros', 'fs', 'net', 'runtime', 'time'] }
compio-quic = { version = "0.8.0", default-features = false, features = ['ring'] }
compio-runtime = { version = "0.12.0" }
anyhow = { workspace = true }
clap = { version = '4', features = ['derive', 'env', 'color'] }
indicatif = { version = '0.18', features = ['improved_unicode'] }
console = '0.16'
tar = '0.4'
walkdir = '2'
futures-util = { workspace = true }
get_if_addrs = '0.5.3'
flume = '0.12.0'
rand = { workspace = true }
