[workspace]
members = ["hayate", "hayate-cli"]
resolver = "2"

[workspace.package]
version = "5.0.0"
edition = "2024"
authors = ["ShiinaSaku"]
license = "MIT"
repository = "https://github.com/ShiinaSaku/Hayate"
rust-version = "1.96"

[workspace.dependencies]
# Completion-based async I/O and QUIC.
compio = { version = "0.19.1", features = ["fs", "macros", "net", "runtime", "time", "signal"] }
compio-quic = { version = "0.8.0", default-features = false, features = ["ring"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# QUIC protocol state machine (no tokio)
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-ring", "log"] }

# Ephemeral TLS for QUIC.
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Application-layer crypto.
x25519-dalek = { version = "2", features = ["reusable_secrets", "static_secrets"] }
chacha20poly1305 = { version = "0.10" }
hkdf = { version = "0.13" }
sha2 = { version = "0.11" }
rand = { version = "0.10" }
ring = { version = "0.17" }
socket2 = { version = "0.6" }

# Data handling and diagnostics.
zstd = { version = "0.13", default-features = false }
anyhow = "1"
thiserror = "2"
hex = "0.4"
blake3 = "1.8"
rapidhash = "4"
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"] }
tar = "0.4"
walkdir = "2"
get_if_addrs = "0.5.3"
local-ip-address = "0.6.13"
flume = "0.12.0"
mdns-sd = { version = "0.20", default-features = false }
clap = { version = "4", features = ["color", "derive", "env"] }
console = "0.16"
indicatif = { version = "0.18", features = ["improved_unicode"] }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-full]
inherits = "release"

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

