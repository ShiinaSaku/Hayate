[workspace]
members = [
    "hayate-engine",
    "hayate-cli",
    "hayate-ffi",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2024"
authors = ["ShiinaSaku"]
license = "MIT"
repository = "https://github.com/ShiinaSaku/Hayate"
rust-version = "1.96"

[workspace.dependencies]
# async runtime: thread-per-core, io_uring / IOCP / kqueue
compio            = { version = "0.19.0", features = ["macros", "fs", "net", "runtime"] }
compio-runtime    = { version = "0.12.0" }
compio-quic       = { version = "0.8.0",  default-features = false, features = ["ring"] }
futures-util      = { version = "0.3",          default-features = false, features = ["sink", "std"] }

# QUIC protocol state machine (no tokio)
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-ring", "log"] }

# TLS
rcgen     = { version = "0.14", features = ["x509-parser"] }
rustls    = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Crypto: X25519 ECDH + ChaCha20-Poly1305 AEAD + HKDF-SHA256
x25519-dalek      = { version = "2", features = ["reusable_secrets", "static_secrets"] }
chacha20poly1305  = { version = "0.10" }
hkdf              = { version = "0.13" }
sha2              = { version = "0.11" }
rand              = { version = "0.10" }
ring              = { version = "0.17" }
socket2           = { version = "0.6" }

# Compression
zstd = { version = "0.13", default-features = false }

# Error handling
anyhow    = "1"
thiserror = "2"

# Checksum
hex = "0.4"

# Serialization (binary protocol framing)
bytes = "1"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"
strip         = "symbols"

[profile.release-full]
inherits      = "release"
lto           = "fat"
