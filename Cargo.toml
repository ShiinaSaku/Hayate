[workspace]
members = ["hayate-engine", "hayate-cli"]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2024"
authors = ["ShiinaSaku"]
license = "MIT"
repository = "https://github.com/ShiinaSaku/Hayate"
rust-version = "1.95"

[workspace.dependencies]
# Completion-based async I/O and QUIC.
compio = { version = "0.19.1", features = ["fs", "macros", "net", "runtime", "time"] }
compio-quic = { version = "0.8.0", default-features = false, features = ["ring"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# QUIC protocol state machine (no tokio)
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-ring", "log"] }

# Ephemeral TLS for QUIC.
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Application-layer crypto.
x25519-dalek = { version = "2", features = ["reusable_secrets", "static_secrets"] }
chacha20poly1305 = { version = "0.10" }
hkdf = { version = "0.13" }
sha2 = { version = "0.11" }
rand = { version = "0.10" }
ring = { version = "0.17" }
socket2 = { version = "0.6" }

# Data handling and diagnostics.
zstd = { version = "0.13", default-features = false }
anyhow = "1"
thiserror = "2"
hex = "0.4"
blake3 = "1.8"
rapidhash = "4"
dialoguer = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-full]
inherits = "release"
lto = "fat"
