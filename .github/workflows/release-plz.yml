name: Release-plz

# Version PRs + crates.io publishing.
#
# `release-plz release` pushes the version tag. GitHub does not start new
# workflow runs for events created by the default GITHUB_TOKEN, so the tag
# would not reach `release.yml` (cargo-dist) unless it is pushed with an App
# token or PAT. Set RELEASE_PLZ_TOKEN for full automation; without it the crate
# is still published and tagged, but the binary release must be triggered
# manually (`gh workflow run release.yml --ref vX.Y.Z`).

on:
  push:
    branches:
      - master

permissions: {}

jobs:
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      # crates.io trusted publishing: release-plz exchanges this OIDC token for
      # a short-lived registry token, so no CARGO_REGISTRY_TOKEN is stored.
      id-token: write
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          # App/PAT token so the pushed tag triggers cargo-dist's release.yml.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
