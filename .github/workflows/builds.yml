name: Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runs_on || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hayate-darwin-amd64
            target: x86_64-apple-darwin
            runs_on: macos-latest
            output: hayate
            rename_to: hayate-darwin-amd64
          - name: hayate-darwin-arm64
            target: aarch64-apple-darwin
            runs_on: macos-latest
            output: hayate
            rename_to: hayate-darwin-arm64
          - name: hayate-linux-amd64
            target: x86_64-unknown-linux-gnu
            output: hayate
            rename_to: hayate-linux-amd64
          - name: hayate-linux-arm64
            target: aarch64-unknown-linux-gnu
            output: hayate
            rename_to: hayate-linux-arm64
          - name: hayate-windows-amd64
            target: x86_64-pc-windows-msvc
            runs_on: windows-latest
            output: hayate.exe
            rename_to: hayate-windows-amd64.exe
          - name: hayate-termux-arm64
            target: aarch64-linux-android
            output: hayate
            rename_to: hayate-termux-arm64
            is_android: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cross-compilers (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Set up NDK (Android)
        if: matrix.is_android
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Build Binary
        shell: bash
        env:
          # Target configuration for Linux ARM64
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          # Target configuration for Android ARM64
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: aarch64-linux-android24-clang
          CC_aarch64_linux_android: aarch64-linux-android24-clang
          AR_aarch64_linux_android: llvm-ar
        run: |
          if [ "${{ matrix.is_android }}" = "true" ]; then
            # Add NDK toolchain bin to PATH
            export PATH="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          fi
          cargo build --target ${{ matrix.target }} --release --bin hayate

      - name: Package Binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.output }} dist/${{ matrix.rename_to }}
          cd dist
          sha256sum "${{ matrix.rename_to }}" > "${{ matrix.rename_to }}.sha256" || certutil -hashfile "${{ matrix.rename_to }}" SHA256 > "${{ matrix.rename_to }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.rename_to }}
            dist/${{ matrix.rename_to }}.sha256
          if-no-files-found: error
