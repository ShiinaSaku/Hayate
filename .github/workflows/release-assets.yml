name: Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runs_on || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hayate-darwin-amd64
            target: x86_64-apple-darwin
            runs_on: macos-latest
            output: hayate
            rename_to: hayate-darwin-amd64

          - name: hayate-darwin-arm64
            target: aarch64-apple-darwin
            runs_on: macos-latest
            output: hayate
            rename_to: hayate-darwin-arm64

          - name: hayate-linux-amd64
            target: x86_64-unknown-linux-gnu
            output: hayate
            rename_to: hayate-linux-amd64

          - name: hayate-linux-arm64
            target: aarch64-unknown-linux-gnu
            output: hayate
            rename_to: hayate-linux-arm64
            use_zigbuild: true

          - name: hayate-linux-amd64-musl
            target: x86_64-unknown-linux-musl
            output: hayate
            rename_to: hayate-linux-amd64-musl
            use_zigbuild: true

          - name: hayate-linux-arm64-musl
            target: aarch64-unknown-linux-musl
            output: hayate
            rename_to: hayate-linux-arm64-musl
            use_zigbuild: true

          - name: hayate-windows-amd64
            target: x86_64-pc-windows-msvc
            runs_on: windows-latest
            output: hayate.exe
            rename_to: hayate-windows-amd64.exe

          - name: hayate-windows-arm64
            target: aarch64-pc-windows-msvc
            runs_on: windows-latest
            output: hayate.exe
            rename_to: hayate-windows-arm64.exe

          - name: hayate-termux-arm64
            target: aarch64-linux-android
            output: hayate
            rename_to: hayate-termux-arm64
            is_android: true

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Zig
        if: matrix.use_zigbuild
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        run: pip install cargo-zigbuild

      - name: Set up NDK (Android)
        if: matrix.is_android
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Build Binary
        shell: bash
        run: |
          if [ "${{ matrix.is_android }}" = "true" ]; then
            cargo install cargo-ndk
            cargo ndk -t aarch64-linux-android build --profile release-full --bin hayate
          elif [ "${{ matrix.use_zigbuild }}" = "true" ]; then
            cargo zigbuild --target ${{ matrix.target }} --profile release-full --bin hayate
          else
            cargo build --target ${{ matrix.target }} --profile release-full --bin hayate
          fi

      - name: Rename Binary
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release-full/${{ matrix.output }} ${{ matrix.rename_to }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.rename_to }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: target/artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la target/artifacts/

      - uses: actions/attest@v4
        with:
          subject-path: "target/artifacts/*"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: target/artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
