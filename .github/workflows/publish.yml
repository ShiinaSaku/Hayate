name: Publish

on:
  push:
    branches:
      - master

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck release scripts
        run: bun run typecheck

      # crates.io trusted publishing: exchanges the GitHub OIDC token for a
      # short-lived crates.io token — no long-lived CARGO_REGISTRY_TOKEN
      # secret. Requires the crate's Trusted Publishing config on crates.io
      # (repo ShiinaSaku/Hayate, workflow publish.yml).
      - name: Authenticate with crates.io (trusted publishing)
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Version and publish
        run: bun run tegami ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      # The `release: published` event does not reliably fire when the release
      # is created by this workflow via the default GITHUB_TOKEN, so trigger the
      # binary/npm build explicitly once Tegami has created the release.
      # NOTE: workflow_dispatch returns 403 with the default GITHUB_TOKEN
      # (GitHub blocks it from starting new runs), so this uses a PAT stored as
      # the RELEASE_PAT secret — classic PAT needs the `repo` scope; a
      # fine-grained PAT needs Actions: write + Contents: read on this repo.
      - name: Trigger Release Binaries
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          tag=$(curl -sf --retry 3 \
            -H "Authorization: Bearer $RELEASE_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | jq -r '.tag_name')
          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "error: could not resolve latest release tag" >&2
            exit 1
          fi
          echo "Triggering Release Binaries for tag: $tag"
          curl -sf --retry 3 -X POST \
            -H "Authorization: Bearer $RELEASE_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/release-binaries.yml/dispatches" \
            -d "$(jq -nc --arg ref "${{ github.ref_name }}" --arg tag "$tag" \
              '{ref: $ref, inputs: {tag: $tag}}')"
